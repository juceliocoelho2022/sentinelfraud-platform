services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: sentinelfraud, POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelfraud"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      otel-collector: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sentinelfraud
      DB_USER: sentinel
      DB_PASSWORD: sentinel
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VELOCITY_WINDOW: PT1M
      VELOCITY_THRESHOLD: 5
      VELOCITY_SCORE: 35
      OUTBOX_FIXED_DELAY: 1000
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_MAX_ATTEMPTS: 8
      DEVICE_INTELLIGENCE_BASE_URL: http://app:8080
      KAFKA_CONSUMER_GROUP: sentinelfraud-investigation-v1
      KAFKA_RETRY_ATTEMPTS: 3
      KAFKA_RETRY_BACKOFF: 500
      ANALYST_USERNAME: analyst
      ANALYST_PASSWORD: analyst-demo
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-demo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: 1.0
    ports: ["8080:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro"]
    depends_on:
      tempo: { condition: service_started }

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app: { condition: service_started }
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-demo
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
    ports: ["3000:3000"]
volumes:
  postgres_data: {}
  prometheus_data: {}
  tempo_data: {}
  grafana_data: {}
