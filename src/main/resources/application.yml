spring:
  application.name: sentinelfraud-platform
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelfraud}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:sentinelfraud-investigation-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  health:
    circuitbreakers.enabled: true
server:
  shutdown: graceful
  error.include-message: never
fraud:
  rules:
    high-amount-threshold: ${HIGH_AMOUNT_THRESHOLD:10000}
    velocity:
      window: ${VELOCITY_WINDOW:PT1M}
      threshold: ${VELOCITY_THRESHOLD:5}
      score: ${VELOCITY_SCORE:35}
  device-intelligence:
    base-url: ${DEVICE_INTELLIGENCE_BASE_URL:http://localhost:8080}
    connect-timeout: ${DEVICE_INTELLIGENCE_CONNECT_TIMEOUT:PT0.3S}
    read-timeout: ${DEVICE_INTELLIGENCE_READ_TIMEOUT:PT0.5S}
    unavailable-score: ${DEVICE_INTELLIGENCE_UNAVAILABLE_SCORE:15}
outbox:
  relay:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  send-timeout: ${OUTBOX_SEND_TIMEOUT:PT5S}

resilience4j:
  retry:
    instances:
      deviceIntelligence:
        max-attempts: 2
        wait-duration: 100ms
  circuitbreaker:
    instances:
      deviceIntelligence:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

kafka:
  topics:
    fraud-decisions: fraud.assessment.completed.v1
    fraud-decisions-dlt: fraud.assessment.completed.v1-dlt
    fraud-decisions-replay: fraud.assessment.completed.v1.replay
  consumer:
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
    retry-backoff: ${KAFKA_RETRY_BACKOFF:500}

security:
  jwt:
    issuer: sentinelfraud-platform
    ttl: ${JWT_TTL:PT1H}
  demo-users:
    analyst:
      username: ${ANALYST_USERNAME:analyst}
      password: ${ANALYST_PASSWORD:analyst-demo}
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin-demo}
