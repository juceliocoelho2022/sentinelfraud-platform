spring:
  application.name: sentinelfraud-platform
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelfraud}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
server:
  shutdown: graceful
  error.include-message: never
fraud:
  rules:
    high-amount-threshold: ${HIGH_AMOUNT_THRESHOLD:10000}
    velocity:
      window: ${VELOCITY_WINDOW:PT1M}
      threshold: ${VELOCITY_THRESHOLD:5}
      score: ${VELOCITY_SCORE:35}
